<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Water Tracker</title>

<style>
:root{
  --bg:#191a1c;
  --card:#202226;
  --card2:#25282d;
  --line:rgba(255,255,255,.08);

  --text:#f5f7f9;
  --muted:#8f969e;

  --blue:#55c7ff;
  --blue2:#238cff;
  --cyan:#66e4ff;

  --gradient:linear-gradient(135deg,#66e4ff,#238cff);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0!important;
  padding:0!important;
  width:100%;
  min-height:100%;
  background:#191a1c!important;
}

body{
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:420px;
  margin:auto;
  padding:12px;
}

/* CARD */

.card{
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.025),
      transparent 55%
    ),
    var(--card);

  box-shadow:0 10px 30px rgba(0,0,0,.18);
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.title{
  display:flex;
  align-items:center;
  gap:9px;
}

.icon{
  width:31px;
  height:31px;

  display:grid;
  place-items:center;

  border-radius:9px;

  background:rgba(72,190,255,.1);
  color:var(--blue);

  font-size:16px;
}

h1{
  margin:0;
  font-size:15px;
  letter-spacing:-.3px;
}

.subtitle{
  margin:2px 0 0;
  color:var(--muted);
  font-size:9px;
}

/* SETTINGS BUTTON */

.settings-btn{
  width:30px;
  height:30px;

  border:1px solid var(--line);
  border-radius:8px;

  background:var(--card2);
  color:var(--muted);

  font-size:14px;

  transition:.18s;
}

.settings-btn:hover{
  color:var(--blue);
  border-color:rgba(85,199,255,.35);
}

/* WATER */

.water{
  text-align:center;
}

.amount{
  display:flex;
  justify-content:center;
  align-items:baseline;
  gap:5px;

  margin-top:2px;
}

.amount-number{
  font-size:43px;
  font-weight:900;
  letter-spacing:-3px;
  line-height:1;
}

.amount-unit{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

/* PROGRESS */

.progress-info{
  display:flex;
  justify-content:space-between;

  margin-top:12px;
  margin-bottom:6px;

  font-size:9px;
}

.progress-info span:first-child{
  color:var(--muted);
}

.progress-info span:last-child{
  color:var(--blue);
  font-weight:700;
}

.progress{
  height:6px;

  overflow:hidden;

  border-radius:99px;

  background:rgba(255,255,255,.07);
}

.progress-fill{
  width:0;
  height:100%;

  border-radius:inherit;

  background:var(--gradient);

  box-shadow:0 0 12px rgba(35,140,255,.3);

  transition:.3s ease;
}

/* BUTTONS */

.controls{
  display:grid;
  grid-template-columns:44px 1fr 44px;

  gap:8px;

  margin-top:14px;
}

.control{
  height:38px;

  border:1px solid var(--line);
  border-radius:9px;

  background:var(--card2);
  color:var(--text);

  font-size:18px;
  font-weight:700;

  transition:.18s;
}

.control:hover{
  border-color:rgba(85,199,255,.4);
  background:#292d33;
}

.add{
  background:var(--gradient);
  border:0;
  color:#07131d;

  font-size:11px;
  font-weight:800;
}

.add:hover{
  filter:brightness(1.08);
}

/* QUICK AMOUNTS */

.quick{
  display:flex;
  justify-content:center;
  gap:6px;

  margin-top:9px;
}

.quick button{
  border:1px solid var(--line);
  border-radius:7px;

  padding:5px 8px;

  background:transparent;
  color:var(--muted);

  font-size:9px;
}

.quick button:hover{
  color:var(--blue);
  border-color:rgba(85,199,255,.3);
}

/* SETTINGS */

.settings{
  display:none;

  margin-top:10px;
  padding-top:12px;

  border-top:1px solid var(--line);
}

.settings.open{
  display:block;
}

.settings-title{
  margin-bottom:9px;

  color:var(--text);
  font-size:11px;
  font-weight:700;
}

.settings-row{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;

  gap:8px;
}

.settings-row label{
  color:var(--muted);
  font-size:10px;
}

input{
  width:80px;

  padding:7px 8px;

  border:1px solid var(--line);
  border-radius:7px;

  outline:none;

  background:#17181a;
  color:var(--text);

  text-align:center;
  font-size:11px;
}

input:focus{
  border-color:rgba(85,199,255,.6);
}

.save{
  width:100%;

  margin-top:9px;
  padding:7px;

  border:0;
  border-radius:7px;

  background:var(--gradient);
  color:#07131d;

  font-size:10px;
  font-weight:800;
}

/* MOBILE */

@media(max-width:350px){

  .app{
    padding:9px;
  }

  .amount-number{
    font-size:38px;
  }

}
</style>
</head>

<body>

<main class="app">

<section class="card">

  <div class="header">

    <div class="title">

      <div class="icon">💧</div>

      <div>
        <h1>Water Tracker</h1>
        <p class="subtitle">Stay hydrated.</p>
      </div>

    </div>

    <button
      class="settings-btn"
      id="settingsBtn"
      type="button">
      ⚙
    </button>

  </div>


  <div class="water">

    <div class="amount">

      <span
        class="amount-number"
        id="amount">
        0
      </span>

      <span class="amount-unit">
        ml
      </span>

    </div>


    <div class="progress-info">

      <span>
        Daily goal
      </span>

      <span id="percent">
        0%
      </span>

    </div>


    <div class="progress">

      <div
        class="progress-fill"
        id="progress">
      </div>

    </div>


    <div class="controls">

      <button
        class="control"
        id="minus"
        type="button">
        −
      </button>

      <button
        class="control add"
        id="add"
        type="button">
        + 250 ml
      </button>

      <button
        class="control"
        id="plus"
        type="button">
        +
      </button>

    </div>


    <div class="quick">

      <button data-amount="150">
        +150
      </button>

      <button data-amount="250">
        +250
      </button>

      <button data-amount="500">
        +500
      </button>

    </div>

  </div>


  <div
    class="settings"
    id="settings">

    <div class="settings-title">
      Daily goal
    </div>

    <div class="settings-row">

      <label>
        Water objective
      </label>

      <input
        id="goalInput"
        type="number"
        min="250"
        max="10000"
        step="50">

    </div>

    <button
      class="save"
      id="save"
      type="button">
      Save objective
    </button>

  </div>

</section>

</main>


<script>

const KEY="water_tracker_v1";


const DEFAULT={
  amount:0,
  goal:2000,
  date:new Date().toISOString().slice(0,10)
};


let data=load();


function load(){

  try{

    const saved=
      JSON.parse(
        localStorage.getItem(KEY)
      );

    if(!saved){
      return {...DEFAULT};
    }

    const today=
      new Date().toISOString().slice(0,10);

    if(saved.date!==today){

      return{
        amount:0,
        goal:Number(saved.goal)||2000,
        date:today
      };

    }

    return{
      amount:Math.max(
        0,
        Number(saved.amount)||0
      ),

      goal:Math.max(
        250,
        Number(saved.goal)||2000
      ),

      date:today
    };

  }catch{

    return {...DEFAULT};

  }

}


function saveData(){

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

}


function render(){

  const amount=
    document.getElementById("amount");

  const progress=
    document.getElementById("progress");

  const percent=
    document.getElementById("percent");

  const goalInput=
    document.getElementById("goalInput");


  amount.textContent=
    data.amount;


  const percentage=
    Math.min(
      100,
      Math.round(
        data.amount/data.goal*100
      )
    );


  percent.textContent=
    percentage+"%";


  progress.style.width=
    percentage+"%";


  goalInput.value=
    data.goal;

}


function addWater(value){

  data.amount=
    Math.max(
      0,
      data.amount+value
    );

  saveData();
  render();

}


document
  .getElementById("plus")
  .onclick=()=>{
    addWater(250);
  };


document
  .getElementById("minus")
  .onclick=()=>{
    addWater(-250);
  };


document
  .getElementById("add")
  .onclick=()=>{
    addWater(250);
  };


document
  .querySelectorAll(".quick button")
  .forEach(button=>{

    button.onclick=()=>{

      addWater(
        Number(
          button.dataset.amount
        )
      );

    };

  });


document
  .getElementById("settingsBtn")
  .onclick=()=>{

    document
      .getElementById("settings")
      .classList.toggle("open");

  };


document
  .getElementById("save")
  .onclick=()=>{

    const value=
      Number(
        document.getElementById("goalInput").value
      );


    if(
      !Number.isFinite(value) ||
      value<250 ||
      value>10000
    ){

      return;

    }


    data.goal=
      Math.round(value/50)*50;


    saveData();
    render();

    document
      .getElementById("settings")
      .classList.remove("open");

  };


render();

</script>

</body>
</html>
